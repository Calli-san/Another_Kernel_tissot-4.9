name: Tissot A15 Treble - Next legacy and SUSFS (experimental)

on:
  push:
    branches: [NON-OC, 'codex/ksunext-susfs-4.9']
  pull_request:
    branches: [NON-OC]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tissot-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libncurses-dev libssl-dev libelf-dev python3 git zip gcc-10-aarch64-linux-gnu gcc-10-arm-linux-gnueabi
          mkdir -p "$RUNNER_TEMP/cross-bin"
          ln -s /usr/bin/aarch64-linux-gnu-gcc-10 "$RUNNER_TEMP/cross-bin/aarch64-linux-gnu-gcc"
          ln -s /usr/bin/arm-linux-gnueabi-gcc-10 "$RUNNER_TEMP/cross-bin/arm-linux-gnueabi-gcc"
          echo "$RUNNER_TEMP/cross-bin" >> "$GITHUB_PATH"

      - name: Build kernel
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-tissot.sh 2>&1 | tee kernel_build.log

      - name: Package experimental AnyKernel ZIP
        run: bash scripts/package-tissot.sh

      - name: Upload kernel and installer
        uses: actions/upload-artifact@v4
        with:
          name: Tissot-A15-Treble-Next-SUSFS-EXPERIMENTAL
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: kernel_build.log
          if-no-files-found: ignore
          retention-days: 7
